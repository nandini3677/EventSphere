<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup as</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      text-align: center;
      padding: 50px;
    }
    h1 {
      margin-bottom: 40px;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .card {
      background: pink;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      cursor: pointer;
      font-size: 22px;
      font-weight: bold;
      transform: rotate(-20deg);
      transition: 0.3s;
    }
    .card:hover {
      background: #ff90a0;
      transform: scale(1.05) rotate(-20deg);
    }
    .role-title {
      margin-top: 10px;
      font-size: 18px;
    }
    .hidden {
      display: none;
    }
    .form-box {
      margin-top: 40px;
    }
    form input {
      display: block;
      width: 250px;
      margin: 10px auto;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }
    form button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: pink;
      cursor: pointer;
      font-weight: bold;
    }
    form button:hover {
      background: #ff90a0;
    }
  </style>
</head>
<body>
  <h1>Signup as</h1>
  <div class="container">
    <div class="role">
      <div class="card" onclick="showForm('Visitor')">Form</div>
      <div class="role-title">A Visitor</div>
    </div>
    <div class="role">
      <div class="card" onclick="showForm('Self Organizer')">Form</div>
      <div class="role-title">A Self Organizer</div>
    </div>
    <div class="role">
      <div class="card" onclick="showForm('Company Organizer')">Form</div>
      <div class="role-title">Company Organizer</div>
    </div>
  </div>

  <!-- Forms -->
  <div id="formBox" class="form-box hidden">
    <h2 id="formTitle"></h2>
    <form id="signupForm">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="hidden" name="role" id="roleInput">
      <button type="submit">Register</button>
    </form>
  </div>

  <script>
    function showForm(role) {
      document.getElementById("formBox").classList.remove("hidden");
      document.getElementById("formTitle").innerText = "Register as " + role;
      document.getElementById("roleInput").value = role;
    }

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = {
        name: e.target.name.value,
        email: e.target.email.value,
        password: e.target.password.value,
        role: e.target.role.value
      };
      let res = await fetch("/signup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(formData)
      });
      let data = await res.json();
      alert(data.message);
    });
  </script>
</body>
</html>
