<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventSphere - Sign In / Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #E6D3B8, #BC9F7D, #A27246);
  color: #623817;
  text-align: center;
  padding: 30px;
}
h1,h2 { 
  color:#623817; 
  text-shadow:1px 1px 4px rgba(0,0,0,0.15);
}
.toggle-btns button {
  padding:10px 20px; margin:0 10px;
  border:2px solid #623817;
  border-radius:25px;
  background:#BC9F7D; color:#623817;
  cursor:pointer; font-weight:bold; transition:0.3s;
}
.toggle-btns button.active{ background:#A27246; color:#fff;}
.form-box {
  background:#E6D3B8dd; 
  padding:40px 30px 30px;
  border-radius:20px; 
  width:400px;
  margin:50px auto; 
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  border:2px solid #A27246; 
  text-align:left;
  position: relative;
}
.icon-circle {
  width:70px; height:70px; 
  border-radius:50%;
  background:#A27246;
  color:#fff;
  display:flex; justify-content:center; align-items:center;
  font-size:28px;
  position:absolute;
  top:-35px;
  left:50%;
  transform:translateX(-50%);
  box-shadow:0 6px 14px rgba(0,0,0,0.2);
}
form input,form select {
  display:block; width:95%; margin:10px auto; padding:10px;
  border-radius:10px; border:1px solid #A27246; background:#F5E7D3;
  font-size:15px; color:#623817;
}
.checkbox { display:flex; align-items:center; gap:8px; margin:10px; font-size:14px; }
form button { padding:12px; border:none; border-radius:25px; background:#A27246; color:#fff; cursor:pointer; font-weight:bold; width:100%; transition:0.3s; }
form button:hover { background:#BC9F7D; }
.hidden { display:none; }
.container { display:flex; justify-content:center; gap:40px; flex-wrap:wrap; margin-bottom:40px; }
.card { 
  background:#BC9F7D; width:160px; height:160px; 
  display:flex; justify-content:center; align-items:center; 
  border-radius:50%; cursor:pointer; font-size:50px; color:#fff; 
  box-shadow:0 6px 14px rgba(0,0,0,0.15); transition:0.3s; border:3px solid #A27246; 
}
.card:hover { background:#A27246; color:#fff; transform:scale(1.1); box-shadow:0 12px 24px rgba(0,0,0,0.2); }
.role-title { margin-top:10px; font-size:16px; font-weight:500; color:#623817; }
</style>
</head>
<body>

<div class="toggle-btns">
  <button id="showSignIn" class="active">Sign In</button>
  <button id="showSignUp">Sign Up</button>
</div>

<div id="signInForm" class="form-box">
  <div class="icon-circle"><i class="fas fa-right-to-bracket"></i></div>
  <h2>Sign In</h2>
  <form id="loginForm">
    <select name="role" required>
      <option value="">Select Role</option>
      <option value="visitor">Visitor</option>
      <option value="self">Self Organizer</option>
      <option value="organizer">Company Organizer</option>
    </select>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
</div>

<div id="signUpSection" class="hidden">
  <h1>Signup as</h1>
  <div class="container">
    <div class="role">
      <div class="card" onclick="showForm('visitor')"><i class="fas fa-user"></i></div>
      <div class="role-title">Visitor</div>
    </div>
    <div class="role">
      <div class="card" onclick="showForm('self')"><i class="fas fa-user-tie"></i></div>
      <div class="role-title">Self Organizer</div>
    </div>
    <div class="role">
      <div class="card" onclick="showForm('organizer')"><i class="fas fa-building"></i></div>
      <div class="role-title">Company Organizer</div>
    </div>
  </div>

  <!-- Forms -->
  <div id="visitorForm" class="form-box hidden">
    <div class="icon-circle"><i class="fas fa-user"></i></div>
    <h2>Register as Visitor</h2>
    <form id="visitorSignup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="mobile" placeholder="Mobile Number (optional)">
      <select name="event_type">
        <option value="">Select Event Type (optional)</option>
        <option>Birthday</option><option>Wedding</option><option>College</option><option>Party</option><option>Other</option>
      </select>
      <input type="text" name="event_space" placeholder="Event Space Name" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <div class="checkbox"><input type="checkbox" required> I agree to Terms & Conditions</div>
      <button type="submit">Signup</button>
    </form>
  </div>

  <div id="selfForm" class="form-box hidden">
    <div class="icon-circle"><i class="fas fa-user-tie"></i></div>
    <h2>Register as Self Organizer</h2>
    <form id="selfSignup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="mobile" placeholder="Mobile Number" required>
      <input type="text" name="company" placeholder="Company / Organization Name" required>
      <select name="business_type" required>
        <option value="">Select Business Type</option>
        <option>Event Management</option><option>Catering</option><option>Venue</option><option>Decor</option><option>Other</option>
      </select>
      <input type="text" name="website" placeholder="Company Website / Social Link (optional)">
      <input type="text" name="company_id" placeholder="Company ID / GST / PAN (optional)">
      <input type="text" name="event_space" placeholder="Event Space Name (optional)">
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <div class="checkbox"><input type="checkbox" required> I agree to Terms & Conditions</div>
      <button type="submit">Signup</button>
    </form>
  </div>

  <div id="organizerForm" class="form-box hidden">
    <div class="icon-circle"><i class="fas fa-building"></i></div>
    <h2>Register as Company Organizer</h2>
    <form id="organizerSignup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="mobile" placeholder="Mobile Number" required>
      <input type="text" name="company" placeholder="Company / Organization Name" required>
      <select name="business_type" required>
        <option value="">Select Business Type</option>
        <option>Event Management</option><option>Catering</option><option>Venue</option><option>Decor</option><option>Other</option>
      </select>
      <input type="text" name="website" placeholder="Company Website / Social Link (optional)">
      <input type="text" name="company_id" placeholder="Company ID / GST / PAN (optional)">
      <input type="text" name="event_space" placeholder="Event Space Name (optional)">
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <div class="checkbox"><input type="checkbox" required> I agree to Terms & Conditions</div>
      <button type="submit">Signup</button>
    </form>
  </div>
</div>

<script>
const signInForm = document.getElementById("signInForm");
const signUpSection = document.getElementById("signUpSection");
const showSignInBtn = document.getElementById("showSignIn");
const showSignUpBtn = document.getElementById("showSignUp");

showSignInBtn.addEventListener("click", () => {
  signInForm.classList.remove("hidden");
  signUpSection.classList.add("hidden");
  showSignInBtn.classList.add("active");
  showSignUpBtn.classList.remove("active");
});
showSignUpBtn.addEventListener("click", () => {
  signInForm.classList.add("hidden");
  signUpSection.classList.remove("hidden");
  showSignUpBtn.classList.add("active");
  showSignInBtn.classList.remove("active");
});

function showForm(role){
  document.getElementById("visitorForm").classList.add("hidden");
  document.getElementById("selfForm").classList.add("hidden");
  document.getElementById("organizerForm").classList.add("hidden");
  document.getElementById(role + "Form").classList.remove("hidden");
}

// ===== Fetch API for Backend =====
async function submitForm(url, data){
  const res = await fetch(url,{
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });
  const d = await res.json();
  alert(d.message);
}

// Sign In
document.getElementById("loginForm").addEventListener("submit", e=>{
  e.preventDefault();
  const f = e.target;
  submitForm("/signin", {role:f.role.value,email:f.email.value,password:f.password.value});
});

// Visitor Signup
document.getElementById("visitorSignup").addEventListener("submit", e=>{
  e.preventDefault();
  const f=e.target;
  if(f.password.value!==f.confirm_password.value){ alert("Passwords do not match!"); return; }
  submitForm("/signup", {
    role:"visitor", name:f.name.value, email:f.email.value, mobile:f.mobile.value,
    event_type:f.event_type.value, event_space:f.event_space.value, password:f.password.value,
    company:null, business_type:null, website:null, company_id:null
  });
});

// Self Signup
document.getElementById("selfSignup").addEventListener("submit", e=>{
  e.preventDefault();
  const f=e.target;
  if(f.password.value!==f.confirm_password.value){ alert("Passwords do not match!"); return; }
  submitForm("/signup", {
    role:"self", name:f.name.value, email:f.email.value, mobile:f.mobile.value,
    company:f.company.value, business_type:f.business_type.value, website:f.website.value,
    company_id:f.company_id.value, event_space:f.event_space.value, password:f.password.value,
    event_type:null
  });
});

// Organizer Signup
document.getElementById("organizerSignup").addEventListener("submit", e=>{
  e.preventDefault();
  const f=e.target;
  if(f.password.value!==f.confirm_password.value){ alert("Passwords do not match!"); return; }
  submitForm("/signup", {
    role:"organizer", name:f.name.value, email:f.email.value, mobile:f.mobile.value,
    company:f.company.value, business_type:f.business_type.value, website:f.website.value,
    company_id:f.company_id.value, event_space:f.event_space.value, password:f.password.value,
    event_type:null
  });
});
</script>

</body>
</html>
