<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventSphere - Sign In / Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
body {
  font-family: 'Poppins', sans-serif;
  /* lighter gradient */
  background: linear-gradient(135deg, #f1e4d6, #e4c7a2, #d3a679, #c08d60);
  color: #2f2f2f;
  text-align: center;
  padding: 30px;
}
h1,h2 { 
  color:#8a5a3b; 
  text-shadow:1px 1px 6px rgba(0,0,0,0.15);
}
.toggle-btns button {
  padding:10px 20px; margin:0 10px;
  border:2px solid #b07b52;
  border-radius:25px;
  background:#fff9f4; 
  color:#8a5a3b;
  cursor:pointer; 
  font-weight:bold; 
  transition:0.3s;
}
.toggle-btns button.active{ 
  background:#b07b52; 
  color:#fff;
}
.form-box {
  background:#ffffffee; 
  padding:30px;
  border-radius:20px; 
  width:400px;
  margin:20px auto; 
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  border:2px solid #d3a679; 
  text-align:left;
}
form input,form select {
  display:block; 
  width:95%; 
  margin:10px auto; 
  padding:10px;
  border-radius:10px; 
  border:1px solid #d3a679; 
  background:#fffdfa;
  font-size:15px; 
  color:#2f2f2f;
}
form button { 
  padding:12px; 
  border:none; 
  border-radius:25px; 
  background:#8a5a3b; 
  color:#fff; 
  cursor:pointer; 
  font-weight:bold; 
  width:100%; 
  transition:0.3s; 
}
form button:hover { 
  background:#b07b52; 
}
.hidden { display:none; }
.container { 
  display:flex; 
  justify-content:center; 
  gap:40px; 
  flex-wrap:wrap; 
  margin-bottom:40px; 
}
.card { 
  background:#fff9f4; 
  width:160px; 
  height:160px; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  border-radius:50%; 
  cursor:pointer; 
  font-size:40px;  /* bigger icons */
  font-weight:600; 
  color:#8a5a3b; 
  box-shadow:0 6px 14px rgba(0,0,0,0.15); 
  transition:0.3s; 
  border:3px solid #d3a679; 
}
.card:hover { 
  background:#8a5a3b; 
  color:#fff; 
  transform:scale(1.1); 
  box-shadow:0 12px 24px rgba(0,0,0,0.3); 
}
.role-title { 
  margin-top:10px; 
  font-size:16px; 
  font-weight:500; 
  color:#8a5a3b; 
}
</style>
</head>
<body>

<div class="toggle-btns">
  <button id="showSignIn" class="active">Sign In</button>
  <button id="showSignUp">Sign Up</button>
</div>

<div id="signInForm" class="form-box">
  <h2>Sign In</h2>
  <form id="loginForm">
    <select name="role" required>
      <option value="">Select Role</option>
      <option value="visitor">Visitor</option>
      <option value="self">Self Organizer</option>
      <option value="organizer">Company Organizer</option>
    </select>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
</div>

<div id="signUpSection" class="hidden">
  <h1>Signup as</h1>
  <div class="container">
    <!-- Visitor -->
    <div class="role">
      <div class="card" onclick="showForm('visitor')">
        <i class="fas fa-user"></i>
      </div>
      <div class="role-title">Visitor</div>
    </div>

    <!-- Self Organizer -->
    <div class="role">
      <div class="card" onclick="showForm('self')">
        <i class="fas fa-briefcase"></i>
      </div>
      <div class="role-title">Self Organizer</div>
    </div>

    <!-- Company Organizer -->
    <div class="role">
      <div class="card" onclick="showForm('organizer')">
        <i class="fas fa-building"></i>
      </div>
      <div class="role-title">Company Organizer</div>
    </div>
  </div>

  <!-- Visitor Form -->
  <div id="visitorForm" class="form-box hidden">
    <h2>Register as Visitor</h2>
    <form id="visitorSignup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="mobile" placeholder="Mobile Number">
      <select name="event_type">
        <option value="">Select Event Type </option>
        <option>Birthday</option>
        <option>Wedding</option>
        <option>College</option>
        <option>Party</option>
        <option>Other</option>
      </select>
      <input type="text" name="event_space" placeholder="Event Space Name" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Signup</button>
    </form>
  </div>

  <!-- Self Organizer Form -->
  <div id="selfForm" class="form-box hidden">
    <h2>Register as Self Organizer</h2>
    <form id="selfSignup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="mobile" placeholder="Mobile Number" required>
      <input type="text" name="company" placeholder="Company / Organization Name" required>
      <select name="business_type" required>
        <option value="">Select Business Type</option>
        <option>Event Management</option>
        <option>Catering</option>
        <option>Venue</option>
        <option>Decor</option>
        <option>Other</option>
      </select>
      <input type="text" name="website" placeholder="Company Website / Social Link (optional)">
      <input type="text" name="company_id" placeholder="Company ID / GST / PAN (optional)">
      <input type="text" name="event_space" placeholder="Event Space Name ">
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Signup</button>
    </form>
  </div>

  <!-- Company Organizer Form -->
  <div id="organizerForm" class="form-box hidden">
    <h2>Register as Company Organizer</h2>
    <form id="organizerSignup">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="mobile" placeholder="Mobile Number" required>
      <input type="text" name="company" placeholder="Company / Organization Name" required>
      <select name="business_type" required>
        <option value="">Select Business Type</option>
        <option>Event Management</option>
        <option>Catering</option>
        <option>Venue</option>
        <option>Decor</option>
        <option>Other</option>
      </select>
      <input type="text" name="website" placeholder="Company Website / Social Link (optional)">
      <input type="text" name="company_id" placeholder="Company ID / GST / PAN (optional)">
      <input type="text" name="event_space" placeholder="Event Space Name ">
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required>
      <button type="submit">Signup</button>
    </form>
  </div>
</div>

<script>
// Toggle Sign In / Sign Up
const signInForm = document.getElementById("signInForm");
const signUpSection = document.getElementById("signUpSection");
const showSignInBtn = document.getElementById("showSignIn");
const showSignUpBtn = document.getElementById("showSignUp");

showSignInBtn.addEventListener("click", () => {
  signInForm.classList.remove("hidden");
  signUpSection.classList.add("hidden");
  showSignInBtn.classList.add("active");
  showSignUpBtn.classList.remove("active");
});

showSignUpBtn.addEventListener("click", () => {
  signInForm.classList.add("hidden");
  signUpSection.classList.remove("hidden");
  showSignUpBtn.classList.add("active");
  showSignInBtn.classList.remove("active");
});

// Signup forms toggle
function showForm(role){
  document.getElementById("visitorForm").classList.add("hidden");
  document.getElementById("selfForm").classList.add("hidden");
  document.getElementById("organizerForm").classList.add("hidden");
  document.getElementById(role + "Form").classList.remove("hidden");
}

// ----------- AJAX / Fetch for Forms -----------

// Sign In
document.getElementById("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const form = e.target;
  const res = await fetch("/signin", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      role: form.role.value,
      email: form.email.value,
      password: form.password.value
    })
  });
  const data = await res.json();
  alert(data.message);
});

// Visitor Signup
document.getElementById("visitorSignup").addEventListener("submit", async e=>{
  e.preventDefault();
  const form = e.target;
  if(form.password.value !== form.confirm_password.value){
    alert("Passwords do not match!"); return;
  }
  const res = await fetch("/signup", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      role:"visitor",
      name: form.name.value,
      email: form.email.value,
      mobile: form.mobile.value,
      event_type: form.event_type.value,
      event_space: form.event_space.value,
      password: form.password.value
    })
  });
  const data = await res.json();
  alert(data.message);
});

// Self Signup
document.getElementById("selfSignup").addEventListener("submit", async e=>{
  e.preventDefault();
  const form = e.target;
  if(form.password.value !== form.confirm_password.value){
    alert("Passwords do not match!"); return;
  }
  const res = await fetch("/signup", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      role:"self",
      name: form.name.value,
      email: form.email.value,
      mobile: form.mobile.value,
      company: form.company.value,
      business_type: form.business_type.value,
      website: form.website.value,
      company_id: form.company_id.value,
      event_space: form.event_space.value,
      password: form.password.value
    })
  });
  const data = await res.json();
  alert(data.message);
});

// Organizer Signup
document.getElementById("organizerSignup").addEventListener("submit", async e=>{
  e.preventDefault();
  const form = e.target;
  if(form.password.value !== form.confirm_password.value){
    alert("Passwords do not match!"); return;
  }
  const res = await fetch("/signup", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      role:"organizer",
      name: form.name.value,
      email: form.email.value,
      mobile: form.mobile.value,
      company: form.company.value,
      business_type: form.business_type.value,
      website: form.website.value,
      company_id: form.company_id.value,
      event_space: form.event_space.value,
      password: form.password.value
    })
  });
  const data = await res.json();
  alert(data.message);
});
</script>

</body>
</html>
